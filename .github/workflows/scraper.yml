name: Appointment Watcher Bot

on:
  schedule:
    # Runs every 10 minutes. You can change this if needed (e.g., '*/5 * * * *' for every 5 mins)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to manually click "Run workflow" to test it instantly

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-dateutil python-dotenv playwright
          playwright install --with-deps
          uv sync --frozen || pip install -r requirements.txt || true

      - name: Run Appointment Watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python frontdesk_watch_improve.py
